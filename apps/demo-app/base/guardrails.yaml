apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-app
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: demo-app }
---
# Defaults for anything deployed without explicit requests/limits.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
spec:
  limits:
    - type: Container
      default: { cpu: 200m, memory: 128Mi }
      defaultRequest: { cpu: 20m, memory: 32Mi }
      max: { cpu: "1", memory: 512Mi }
---
# Hard ceiling per environment (sized for full canary surge).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 2Gi
    pods: "20"
