apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod

resources:
  - namespace.yaml
  - sealed-secret.yaml # generated by scripts/seal-secret.sh (never plaintext)
  - ../../base

labels:
  - pairs: { env: prod }
    includeSelectors: false

# ---- Release pointer: the only line a version promotion changes ----
images:
  - name: demo-app
    newName: ghcr.io/sira26m/demo-app
    newTag: "1.0.0"

configMapGenerator:
  - name: demo-app-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - ERROR_RATE=0
  - name: loadgen-config
    behavior: merge
    literals:
      - TARGET_HOST=prod.127.0.0.1.nip.io

patches:
  - target: { kind: IngressRoute, name: demo-app }
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`prod.127.0.0.1.nip.io`)
  # prod inherits the conservative 10/25/50/75 canary profile from base
  - target: { group: argoproj.io, kind: Rollout, name: demo-app }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
