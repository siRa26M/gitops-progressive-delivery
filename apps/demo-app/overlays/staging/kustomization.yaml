apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging

resources:
  - namespace.yaml
  - sealed-secret.yaml # generated by scripts/seal-secret.sh (never plaintext)
  - ../../base

labels:
  - pairs: { env: staging }
    includeSelectors: false

# ---- Release pointer: the only line a version promotion changes ----
images:
  - name: demo-app
    newName: ghcr.io/sira26m/demo-app
    newTag: "1.0.0"

configMapGenerator:
  - name: demo-app-config
    behavior: merge
    literals:
      - APP_ENV=staging
      - ERROR_RATE=0
  - name: loadgen-config
    behavior: merge
    literals:
      - TARGET_HOST=staging.127.0.0.1.nip.io

patches:
  - target: { kind: IngressRoute, name: demo-app }
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`staging.127.0.0.1.nip.io`)
  - target: { group: argoproj.io, kind: Rollout, name: demo-app }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/strategy/canary/steps
        value:
          - setWeight: 25
          - pause: { duration: 45s }
          - setWeight: 50
          - pause: { duration: 45s }
