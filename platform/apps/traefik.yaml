# Edge router. Chosen over ingress-nginx, which upstream retired in March 2026.
# Argo Rollouts drives canary weights natively through a weighted TraefikService.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 41.3.0
      helm:
        releaseName: traefik
        valueFiles:
          - $values/platform/values/traefik.yaml
    - repoURL: https://github.com/siRa26M/gitops-progressive-delivery.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
