# Name matches kubeseal's default so `kubeseal --fetch-cert` works without flags.
fullnameOverride: sealed-secrets-controller

# The sealing key pair is generated by bootstrap.sh (kept in .secrets/, git-ignored)
# and injected before the controller starts, so SealedSecrets in Git survive a
# cluster rebuild. Disable automatic key renewal for the lab; in production keep
# renewal on and back up keys to a KMS/vault.
keyrenewperiod: "0"

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { cpu: 200m, memory: 256Mi }
