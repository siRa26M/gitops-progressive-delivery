deployment:
  replicas: 1

# chart >= 41: type lives under service.spec
service:
  spec:
    type: NodePort

ports:
  web:
    nodePort: 30080     # kind maps this to localhost:80
  websecure:
    nodePort: 30443     # kind maps this to localhost:443

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true       # IngressRoute / TraefikService (canary weights)
  kubernetesIngress:
    enabled: true       # plain Ingress for Argo CD / Prometheus / Rollouts UIs
    # kind has no load balancer: report a fixed address instead of the Service's
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
