deployment:
  replicas: 1

service:
  type: NodePort

ports:
  web:
    nodePort: 30080 # kind maps this to localhost:80
  websecure:
    nodePort: 30443 # kind maps this to localhost:443

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true # IngressRoute / TraefikService (canary weights)
  kubernetesIngress:
    enabled: true # plain Ingress for Argo CD / Prometheus / Rollouts UIs

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

# kind has no load balancer: publish 127.0.0.1 on Ingress status so Argo CD sees them Healthy
additionalArguments:
  - --providers.kubernetesingress.ingressendpoint.ip=127.0.0.1
