# Local 3-node cluster. Traefik is exposed as a NodePort (30080/30443) and kind
# maps those to localhost:80/443, so *.127.0.0.1.nip.io resolves straight to the
# cluster edge with no port-forwarding.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops-lab
networking:
  # kindnet in recent kind releases enforces NetworkPolicy. Set
  # disableDefaultCNI: true and install Calico if your kind version does not.
  disableDefaultCNI: false
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
